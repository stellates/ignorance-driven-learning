      <p class="eyebrow">IT / Web / Privacy</p>
      <h1>opt-in</h1>
      <p class="reading">オプトイン</p>
      <p class="detail-summary">本人が事前に同意してから、配信や利用などを開始する方式。</p>
      <section><h2>どういう意味？</h2><p>ITやWebの文脈では、メール配信・データ利用・通知などについて、利用者が先に『受け取る』『利用を許可する』と明示的に選ぶ方式を指す。opt は『選ぶ』という意味を持ち、opt in は『参加する側を選ぶ』という感覚で使われる。</p></section>
      <section><h2>例</h2><p>メールマガジンの申込欄に自分でチェックを入れて登録する。</p></section>
      <section><h2>また聞いた回数</h2><p>2回</p></section>
