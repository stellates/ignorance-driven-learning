<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知らなかったことを、残す。</title>
  <meta name="description" content="AIに聞いて理解できたことを記録する個人ナレッジ。">
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #f6f6f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    header {
      padding-bottom: 28px;
      border-bottom: 1px solid #d7d7d2;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.3;
      letter-spacing: -0.03em;
    }

    header p {
      margin: 12px 0 0;
      color: #555550;
      line-height: 1.7;
    }

    nav {
      padding-top: 24px;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    nav a:hover {
      text-decoration-thickness: 2px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>知らなかったことを、残す。</h1>
      <p>AIに聞いて理解できたことを記録しています。</p>
    </header>

    <nav aria-label="主要ナビゲーション">
      <a href="./knowledge/">ナレッジを見る <span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
