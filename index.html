<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ignorance Driven Learning</title>
  <meta name="description" content="知らなかったことをAIに聞き、人間が採用した知識だけを蓄積するリポジトリ。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">Ignorance Driven Learning</p>
      <h1>このリポジトリは、<br>私が知らなかったことだけでできています。</h1>
      <p class="lead">AIに聞く。理解する。採用する。忘れたら、また学ぶ。</p>

    <section>
      <div class="section-head">
        <h2>Knowledge</h2>
        <span id="count">0 entries</span>

  </main>
  <script src="./app.js"></script>

</html>
